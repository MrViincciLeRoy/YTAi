name: Shorts Clipper

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      channel:
        description: 'YouTube channel (e.g. @freecodecamp)'
        required: true
        default: '@freecodecamp'

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install yt-dlp google-generativeai

      - name: Write YouTube cookies
        run: |
          cat > cookies.txt << 'COOKIES'
          ${{ secrets.YOUTUBE_COOKIES }}
          COOKIES
          echo "First line: $(head -1 cookies.txt)"
          echo "Lines: $(wc -l < cookies.txt)"

      - name: Debug available formats
        run: |
          cat > cookies.txt << 'COOKIES'
          ${{ secrets.YOUTUBE_COOKIES }}
          COOKIES
          yt-dlp --cookies cookies.txt --list-formats "https://www.youtube.com/watch?v=C842vFY5kRo" 2>&1 | head -50

      - name: Run Shorts Clipper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          CHANNEL="${{ github.event.inputs.channel || '@freecodecamp' }}"
          python shorts_clipper.py "$CHANNEL"

      - name: Upload shorts as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: shorts_output/
          retention-days: 7