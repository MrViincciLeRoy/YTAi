name: Shorts Clipper

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      channel:
        description: 'YouTube channel (e.g. @freecodecamp)'
        required: true
        default: '@freecodecamp'

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg tor

      - name: Start Tor and wait for SOCKS port
        run: |
          sudo service tor start
          echo -n "Waiting for Tor"
          for i in $(seq 1 30); do
            if python3 -c "import socket; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1',9050)); s.close()" 2>/dev/null; then
              echo " - up"
              break
            fi
            echo -n "."
            sleep 2
            if [ "$i" -eq 30 ]; then
              echo " - timed out, continuing without proxy"
            fi
          done

      - name: Install Python dependencies
        run: pip install -U requests[socks]

      - name: Run Shorts Clipper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CHANNEL="${{ github.event.inputs.channel || '@freecodecamp' }}"
          python shorts_clipper.py "$CHANNEL"

      - name: Upload shorts as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: shorts_output/
          retention-days: 7