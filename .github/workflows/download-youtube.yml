name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube video URL"
        required: true
        type: string
      quality:
        description: "Video quality"
        required: false
        default: "highest"
        type: choice
        options:
          - highest
          - lowest
          - 1080p
          - 720p
          - 480p
          - 360p

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytubefix
        run: pip install pytubefix

      - name: Download video
        run: |
          python - <<'EOF'
          import os
          from pytubefix import YouTube
          from pytubefix.cli import on_progress

          url     = os.environ["VIDEO_URL"]
          quality = os.environ["QUALITY"]

          # Try clients in order — IOS & ANDROID bypass bot detection
          # without needing PO tokens or cookies
          clients = ["IOS", "ANDROID", "MWEB"]
          yt = None

          for client in clients:
              try:
                  print(f"Trying client: {client}")
                  yt = YouTube(url, client=client, on_progress_callback=on_progress)
                  title = yt.title   # force metadata fetch to trigger errors early
                  print(f"OK  Connected with {client} client")
                  print(f"    Title : {title}")
                  print(f"    Length: {yt.length}s")
                  break
              except Exception as e:
                  print(f"ERR {client} failed: {e}")
                  yt = None

          if yt is None:
              raise RuntimeError("All clients failed. See logs above.")

          # Pick the right stream
          if quality == "highest":
              stream = yt.streams.get_highest_resolution()
          elif quality == "lowest":
              stream = yt.streams.get_lowest_resolution()
          else:
              stream = yt.streams.filter(res=quality, file_extension="mp4").first()
              if not stream:
                  print(f"WARN {quality} not available, falling back to highest")
                  stream = yt.streams.get_highest_resolution()

          print(f"Stream  : {stream.resolution} / {stream.mime_type}")
          print(f"Size    : {stream.filesize_mb:.1f} MB")

          out_dir = "downloaded"
          os.makedirs(out_dir, exist_ok=True)
          path = stream.download(output_path=out_dir)
          print(f"Saved to: {path}")
          EOF
        env:
          VIDEO_URL: ${{ inputs.url }}
          QUALITY:   ${{ inputs.quality }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: downloaded/
          retention-days: 3